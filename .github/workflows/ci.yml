name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # El build solo necesita que existan; en CI no se conecta a Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # El config de Supabase las referencia; en local no se usan.
      GOOGLE_OAUTH_CLIENT_ID: e2e
      GOOGLE_OAUTH_CLIENT_SECRET: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Supabase local (con todas las migraciones)
        run: |
          # Solo en este Supabase de pruebas se habilita el login por correo,
          # para que el usuario de prueba pueda iniciar sesión sin Google.
          sed -i '/^\[auth.email\]/,/^\[/ s/^enable_signup = false/enable_signup = true/' supabase/config.toml
          npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          npx supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "E2E_SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          } >> "$GITHUB_ENV"

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
